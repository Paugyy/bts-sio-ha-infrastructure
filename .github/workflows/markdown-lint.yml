name: Markdown lint

on:
  push:
    branches: [main, develop]
    paths: ["**/*.md", ".markdownlint.yaml", ".github/workflows/markdown-lint.yml"]
  pull_request:
    paths: ["**/*.md", ".markdownlint.yaml", ".github/workflows/markdown-lint.yml"]

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.yaml
          globs: |
            **/*.md
            !node_modules
