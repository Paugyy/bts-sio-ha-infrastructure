name: Links check

on:
  push:
    branches: [main, develop]
    paths: ["**/*.md", ".github/workflows/links-check.yml"]
  pull_request:
    paths: ["**/*.md", ".github/workflows/links-check.yml"]
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi : détection des liens externes morts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal:
    name: Liens internes (bloquant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path node_modules './**/*.md'
          fail: true

  external:
    name: Liens externes (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 2 --exclude '<GITHUB_USER>' --exclude 'github\.io' './**/*.md'
          fail: false
