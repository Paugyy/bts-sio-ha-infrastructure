<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Flux d'une requête WordPress</title>
  <desc id="d">Le client atteint pfSense sur le port 8081, redirigé vers HAProxy port 80, qui choisit WEB-01 ou WEB-02 ; WordPress interroge la base via HAProxy port 3306, réparti sur trois nœuds Galera.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b4656"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e7b46"/></marker>
  </defs>
  <style>
    .b{fill:#fff;stroke:#3b4656;stroke-width:1.4}
    .n{font-size:13px;font-weight:600;fill:#1c2430}
    .s{font-size:11px;fill:#4a5565;font-family:Consolas, Menlo, monospace}
    .st{font-size:12px;font-weight:700;fill:#ffffff}
  </style>
  <rect width="820" height="340" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2430">Requête WordPress de bout en bout</text>

  <rect class="b" x="20" y="110" width="100" height="56" rx="6"/>
  <text class="n" x="70" y="135" text-anchor="middle">Client</text>
  <text class="s" x="70" y="152" text-anchor="middle">réseau labo</text>

  <rect class="b" x="160" y="110" width="110" height="56" rx="6" fill="#fbecea" stroke="#b42318"/>
  <text class="n" x="215" y="135" text-anchor="middle">pfSense</text>
  <text class="s" x="215" y="152" text-anchor="middle">:8081 → DNAT</text>

  <rect class="b" x="310" y="110" width="120" height="56" rx="6"/>
  <text class="n" x="370" y="135" text-anchor="middle">HAProxy</text>
  <text class="s" x="370" y="152" text-anchor="middle">10.0.10.2:80</text>

  <rect class="b" x="480" y="60" width="110" height="50" rx="6"/>
  <text class="n" x="535" y="82" text-anchor="middle">WEB-01</text>
  <text class="s" x="535" y="98" text-anchor="middle">10.0.10.1</text>
  <rect class="b" x="480" y="170" width="110" height="50" rx="6"/>
  <text class="n" x="535" y="192" text-anchor="middle">WEB-02</text>
  <text class="s" x="535" y="208" text-anchor="middle">10.0.10.4</text>

  <rect class="b" x="640" y="110" width="160" height="56" rx="6" fill="#e8f5ee" stroke="#1e7b46"/>
  <text class="n" x="720" y="133" text-anchor="middle">Galera ×3</text>
  <text class="s" x="720" y="150" text-anchor="middle">via 10.0.10.2:3306</text>

  <path d="M120,138 L158,138" stroke="#3b4656" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M270,138 L308,138" stroke="#3b4656" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M430,130 L478,90" stroke="#3b4656" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M430,146 L478,190" stroke="#3b4656" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M590,85 L638,126" stroke="#1e7b46" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <path d="M590,195 L638,152" stroke="#1e7b46" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#g)"/>

  <g>
    <circle cx="139" cy="122" r="10" fill="#1f5fae"/><text class="st" x="139" y="126" text-anchor="middle">1</text>
    <circle cx="289" cy="122" r="10" fill="#1f5fae"/><text class="st" x="289" y="126" text-anchor="middle">2</text>
    <circle cx="455" cy="138" r="10" fill="#1f5fae"/><text class="st" x="455" y="142" text-anchor="middle">3</text>
    <circle cx="614" cy="138" r="10" fill="#1e7b46"/><text class="st" x="614" y="142" text-anchor="middle">4</text>
  </g>

  <g font-size="12" fill="#1c2430">
    <text x="20" y="252">1 · Le client ouvre http://10.4.0.198:8081</text>
    <text x="20" y="270">2 · pfSense redirige (DNAT) vers HAProxy 10.0.10.2:80</text>
    <text x="20" y="288">3 · HAProxy choisit WEB-01 ou WEB-02 (round-robin, health-check /wp-login.php)</text>
    <text x="20" y="306">4 · PHP ouvre une connexion SQL vers HAProxy :3306, répartie sur MYSQL-01/02/03</text>
    <text x="20" y="326" fill="#5d6878" font-size="11">Retour : HAProxy ajoute l'en-tête X-Served-By (WEB-01 ou WEB-02)</text>
  </g>
</svg>
