<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Journalisation centralisée — Rsyslog et LogAnalyzer sur zabbix</title>
  <desc id="d">État au 6 novembre 2026. Les 4 serveurs vWEB et les 3 nœuds vBDD envoient automatiquement leurs journaux en TCP 514 à zabbix (10.0.30.3) à travers pfSense ; guacamol (10.0.30.2) les envoie dans sa propre zone. Rsyslog écrit dans central.log, lu par LogAnalyzer 5.0.2 sur le port 8085, publié par le NAT 2233 pour les sources d'administration. Zabbix reste sur le port 80 (NAT 2231). Restent à faire : journaux de pfSense en UDP 514, postes Windows, rotation, verrouillage et chiffrement.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8494"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e7b46"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#3b4656;stroke-width:1.3}
      .h{font-size:14px;font-weight:700;fill:#1c2430}
      .n{font-size:13px;font-weight:600;fill:#1c2430}
      .m{font-size:11.5px;fill:#4a5565;font-family:Consolas, Menlo, monospace}
      .s{font-size:11px;fill:#5d6878}
      .ok{stroke:#1e7b46;stroke-width:1.8;fill:none}
      .todo{stroke:#7a8494;stroke-width:1.6;fill:none;stroke-dasharray:2 4}
      .lg{font-size:11px;fill:#1e7b46;font-family:Consolas, Menlo, monospace}
      .lt{font-size:11px;fill:#5d6878;font-family:Consolas, Menlo, monospace}
      .lc{font-size:11px;fill:#b45309}
    </style>
  </defs>
  <rect width="920" height="640" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1c2430">Journalisation centralisée — état au 06/11/2026</text>

  <!-- vWEB -->
  <rect x="20" y="70" width="250" height="130" rx="10" fill="#eaf2fb" stroke="#1f5fae" stroke-width="1.4"/>
  <text x="36" y="93" class="h" fill="#1f5fae">VLAN 301 · vWEB</text>
  <text x="36" y="116" class="m">WEB-01 .1 · HAProxy .2</text>
  <text x="36" y="133" class="m">GLPI-01 .3 · WEB-02 .4</text>
  <text x="36" y="160" class="s">Rsyslog + 90-centralisation.conf</text>
  <text x="36" y="182" class="lg">envoi automatique 4/4 ✔</text>

  <!-- vBDD -->
  <rect x="20" y="220" width="250" height="120" rx="10" fill="#e8f5ee" stroke="#1e7b46" stroke-width="1.4"/>
  <text x="36" y="243" class="h" fill="#1e7b46">VLAN 302 · vBDD</text>
  <text x="36" y="266" class="m">MYSQL-01 .1 · MYSQL-02 .2</text>
  <text x="36" y="283" class="m">MYSQL-03 .3</text>
  <text x="36" y="306" class="s">Rsyslog + 90-centralisation.conf</text>
  <text x="36" y="326" class="lg">envoi automatique 3/3 ✔</text>

  <!-- guacamol (vADMIN) -->
  <rect x="20" y="360" width="250" height="56" rx="10" fill="#f2edfb" stroke="#6f42c1" stroke-width="1.4"/>
  <text x="36" y="382" class="n">Guacamole · 10.0.30.2 (VLAN 303)</text>
  <text x="36" y="403" class="lg">même VLAN, sans pfSense · 1/1 ✔</text>

  <!-- pfSense -->
  <rect x="320" y="120" width="220" height="190" rx="8" fill="#fbecea" stroke="#b42318" stroke-width="1.4"/>
  <text x="430" y="143" text-anchor="middle" class="h">pfSense · fw-01</text>
  <text x="334" y="168" class="m">vWEB : PASS TCP 514</text>
  <text x="334" y="185" class="m">vBDD : PASS TCP 514</text>
  <text x="334" y="203" class="s">au-dessus des BLOCK d'isolement,</text>
  <text x="334" y="218" class="s">DEFAULT-DENY reste la dernière</text>
  <text x="334" y="236" class="lc">règles actives à réexporter</text>
  <text x="334" y="262" class="m">Remote Logging</text>
  <text x="334" y="279" class="m">→ 10.0.30.3:514/UDP</text>
  <text x="334" y="297" class="lt">à faire</text>

  <path class="ok" d="M270,140 L318,165" marker-end="url(#ag)"/>
  <path class="ok" d="M270,280 L318,190" marker-end="url(#ag)"/>

  <!-- zabbix -->
  <rect x="600" y="62" width="300" height="320" rx="10" fill="#f2edfb" stroke="#6f42c1" stroke-width="1.4"/>
  <text x="616" y="85" class="h" fill="#6f42c1">ZABBIX · 10.0.30.3 · VLAN 303</text>

  <rect class="box" x="616" y="98" width="268" height="46" rx="6"/>
  <text x="630" y="117" class="n">Apache :80 — Zabbix /zabbix/</text>
  <text x="630" y="134" class="lg">200 en local ✔ · NAT 2231</text>

  <rect class="box" x="616" y="160" width="268" height="46" rx="6" stroke="#1e7b46"/>
  <text x="630" y="179" class="n">Rsyslog :514 TCP/UDP</text>
  <text x="630" y="196" class="lg">8 VM Linux reçues ✔</text>

  <rect class="box" x="616" y="226" width="268" height="52" rx="6" stroke="#1e7b46"/>
  <text x="630" y="245" class="m">/var/log/remote-syslog/</text>
  <text x="630" y="261" class="m">central.log</text>
  <text x="630" y="273" class="s">root:www-data · 0640 · rotation à faire</text>

  <rect class="box" x="616" y="298" width="268" height="68" rx="6" stroke="#1e7b46"/>
  <text x="630" y="317" class="n">Apache :8085 — LogAnalyzer 5.0.2</text>
  <text x="630" y="334" class="lg">source SYSLOG-CENTRAL ✔</text>
  <text x="630" y="350" class="lt">verrouillage install.php : à faire</text>

  <path class="ok" d="M540,178 L575,178 L575,176 L614,176" marker-end="url(#ag)"/>
  <text x="547" y="170" class="lg">TCP 514</text>
  <path class="todo" d="M540,280 L585,280 L585,196 L614,196" marker-end="url(#a)"/>
  <text x="544" y="296" class="lt">UDP 514</text>
  <path class="ok" d="M270,388 L595,388 L595,200 L614,200" marker-end="url(#ag)"/>
  <path class="ok" d="M750,206 L750,224" marker-end="url(#ag)"/>
  <path class="ok" d="M750,278 L750,296" marker-end="url(#ag)"/>
  <text x="758" y="292" class="lg">lecture www-data</text>

  <!-- Poste d'administration et WAN -->
  <rect class="box" x="320" y="450" width="220" height="62" rx="8"/>
  <text x="430" y="473" text-anchor="middle" class="n">Poste d'administration</text>
  <text x="430" y="491" text-anchor="middle" class="s">réseau d'administration autorisé</text>
  <text x="430" y="506" text-anchor="middle" class="s">compte Apache + réseau autorisé</text>

  <rect x="600" y="430" width="300" height="118" rx="8" fill="#fbecea" stroke="#b42318" stroke-width="1.4"/>
  <text x="616" y="453" class="h">pfSense WAN 10.4.0.198</text>
  <text x="616" y="475" class="lg">2231 → 10.0.30.3:80   ✔</text>
  <text x="616" y="492" class="lt">2232 → 10.0.30.3:22   (inchangé)</text>
  <text x="616" y="509" class="lg">2233 → 10.0.30.3:8085 ✔</text>
  <text x="616" y="534" class="s">jamais de NAT : 514 · 10050 · 10051 · 3306</text>

  <path class="ok" d="M540,481 L598,481" marker-end="url(#ag)"/>
  <path class="ok" d="M860,430 L860,368" marker-end="url(#ag)"/>
  <text x="792" y="412" class="lg">→ :8085</text>

  <!-- Restant à faire -->
  <rect x="20" y="450" width="285" height="98" rx="10" fill="#f6f7f9" stroke="#7a8494" stroke-dasharray="3 3"/>
  <text x="36" y="472" class="n">À faire</text>
  <text x="36" y="491" class="s">pfSense (UDP 514) · ADM-01, CLI-01 (Windows)</text>
  <text x="36" y="508" class="s">rotation · résilience après redémarrage</text>
  <text x="36" y="525" class="s">verrouillage LogAnalyzer · HTTPS, VPN</text>
  <text x="36" y="542" class="s">ou tunnel SSH · fichiers applicatifs</text>

  <!-- Légende -->
  <line x1="40" y1="592" x2="90" y2="592" class="ok"/>
  <text x="98" y="596" class="s">fait et testé le 06/11/2026</text>
  <line x1="370" y1="592" x2="420" y2="592" class="todo"/>
  <text x="428" y="596" class="s">à faire</text>
  <text x="40" y="618" class="lc">texte orange : à confirmer</text>
  <text x="428" y="618" class="s">Rsyslog (TCP 514) → central.log → LogAnalyzer</text>
</svg>
