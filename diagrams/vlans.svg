<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">VLAN et trunk 802.1Q</title>
  <desc id="d">pfSense reçoit un trunk 802.1Q portant les VLAN 301 à 304 sur vtnet1 ; chaque VLAN a sa passerelle en .254. Les VM sont étiquetées par Proxmox sur le bridge vmbr1.</desc>
  <rect width="760" height="420" fill="#ffffff"/>
  <style>
    .t{font-size:13px;fill:#1c2430}
    .m{font-size:12px;fill:#4a5565;font-family:Consolas, Menlo, monospace}
    .h{font-size:14px;font-weight:700}
    .r{font-size:12px;fill:#1c2430;font-family:Consolas, Menlo, monospace;white-space:pre}
  </style>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2430">Segmentation VLAN</text>

  <rect x="290" y="50" width="180" height="70" rx="6" fill="#fbecea" stroke="#b42318"/>
  <text x="380" y="76" text-anchor="middle" class="h" fill="#1c2430">pfSense</text>
  <text x="380" y="94" text-anchor="middle" class="m">vtnet0 : WAN 10.4.0.198</text>
  <text x="380" y="110" text-anchor="middle" class="m">vtnet1 : trunk 301-304</text>

  <line x1="380" y1="120" x2="380" y2="160" stroke="#3b4656" stroke-width="4"/>
  <rect x="120" y="160" width="520" height="34" rx="6" fill="#eef1f5" stroke="#8a95a5"/>
  <text x="380" y="182" text-anchor="middle" class="t">Proxmox · bridge vmbr1 (VLAN aware) · étiquette posée sur la carte de chaque VM</text>

  <g>
    <line x1="105" y1="194" x2="105" y2="230" stroke="#1f5fae" stroke-width="2"/>
    <rect x="20" y="230" width="170" height="165" rx="8" fill="#eaf2fb" stroke="#1f5fae"/>
    <text x="35" y="254" class="h" fill="#1f5fae">301 · vWEB</text>
    <text x="35" y="274" class="m">10.0.10.0/24</text>
    <text x="35" y="292" class="m">gw 10.0.10.254</text>
    <text x="35" y="318" class="r" xml:space="preserve">HAProxy  .2</text>
    <text x="35" y="336" class="r" xml:space="preserve">WEB-01   .1</text>
    <text x="35" y="354" class="r" xml:space="preserve">WEB-02   .4</text>
    <text x="35" y="372" class="r" xml:space="preserve">GLPI-01  .3</text>
  </g>
  <g>
    <line x1="290" y1="194" x2="290" y2="230" stroke="#1e7b46" stroke-width="2"/>
    <rect x="205" y="230" width="170" height="165" rx="8" fill="#e8f5ee" stroke="#1e7b46"/>
    <text x="220" y="254" class="h" fill="#1e7b46">302 · vBDD</text>
    <text x="220" y="274" class="m">10.0.20.0/24</text>
    <text x="220" y="292" class="m">gw 10.0.20.254</text>
    <text x="220" y="318" class="r" xml:space="preserve">MYSQL-01 .1</text>
    <text x="220" y="336" class="r" xml:space="preserve">MYSQL-02 .2</text>
    <text x="220" y="354" class="r" xml:space="preserve">MYSQL-03 .3</text>
    <text x="220" y="378" font-size="11" fill="#5d6878">aucune exposition</text>
  </g>
  <g>
    <line x1="475" y1="194" x2="475" y2="230" stroke="#6f42c1" stroke-width="2"/>
    <rect x="390" y="230" width="170" height="165" rx="8" fill="#f2edfb" stroke="#6f42c1"/>
    <text x="405" y="254" class="h" fill="#6f42c1">303 · vADMIN</text>
    <text x="405" y="274" class="m">10.0.30.0/24</text>
    <text x="405" y="292" class="m">gw 10.0.30.254</text>
    <text x="405" y="318" class="r" xml:space="preserve">ADM-01    .1</text>
    <text x="405" y="336" class="r" xml:space="preserve">Guacamole .2</text>
    <text x="405" y="378" font-size="11" fill="#5d6878">SSH, pfSense, stats</text>
  </g>
  <g>
    <line x1="660" y1="194" x2="660" y2="230" stroke="#b7791f" stroke-width="2"/>
    <rect x="575" y="230" width="170" height="165" rx="8" fill="#fff6e0" stroke="#b7791f"/>
    <text x="590" y="254" class="h" fill="#8a5a00">304 · vUSER</text>
    <text x="590" y="274" class="m">10.0.40.0/24</text>
    <text x="590" y="292" class="m">gw 10.0.40.254</text>
    <text x="590" y="318" class="t">Postes clients</text>
    <text x="590" y="378" font-size="11" fill="#5d6878">HAProxy :80 / :8080</text>
  </g>
</svg>
