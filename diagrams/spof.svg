<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Carte des points uniques de défaillance</title>
  <desc id="d">En rouge les SPOF : hôte Proxmox, pfSense, HAProxy, GLPI-01. En vert les composants redondés : WEB-01 et WEB-02, cluster Galera de trois nœuds. En orange : stockage des fichiers WordPress synchronisé par rsync.</desc>
  <style>
    .n{font-size:13px;font-weight:600;fill:#1c2430}
    .s{font-size:11px;fill:#4a5565}
    .spof{fill:#fdecea;stroke:#b42318;stroke-width:2}
    .ok{fill:#e8f5ee;stroke:#1e7b46;stroke-width:1.6}
    .mid{fill:#fff6e0;stroke:#b7791f;stroke-width:1.6}
    .l{stroke:#8a95a5;stroke-width:1.4}
  </style>
  <rect width="780" height="380" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2430">Points uniques de défaillance (SPOF)</text>

  <rect class="spof" x="20" y="44" width="740" height="290" rx="12" fill-opacity="0.35"/>
  <text x="36" y="66" class="n" fill="#b42318">Hôte Proxmox (unique) — sa panne arrête toutes les VM</text>

  <rect class="spof" x="260" y="82" width="260" height="46" rx="6"/>
  <text class="n" x="390" y="102" text-anchor="middle">pfSense</text>
  <text class="s" x="390" y="119" text-anchor="middle">SPOF · amélioration : CARP</text>

  <rect class="spof" x="260" y="156" width="260" height="46" rx="6"/>
  <text class="n" x="390" y="176" text-anchor="middle">HAProxy</text>
  <text class="s" x="390" y="193" text-anchor="middle">SPOF · amélioration : Keepalived + VIP</text>

  <line class="l" x1="390" y1="128" x2="390" y2="156"/>
  <line class="l" x1="330" y1="202" x2="150" y2="240"/>
  <line class="l" x1="390" y1="202" x2="390" y2="240"/>
  <line class="l" x1="450" y1="202" x2="630" y2="240"/>

  <rect class="ok" x="50" y="240" width="200" height="46" rx="6"/>
  <text class="n" x="150" y="262" text-anchor="middle">WEB-01 + WEB-02</text>
  <text class="s" x="150" y="279" text-anchor="middle">redondé (1 panne tolérée)</text>

  <rect class="mid" x="70" y="290" width="160" height="30" rx="5"/>
  <text class="s" x="150" y="309" text-anchor="middle">fichiers : rsync (divergence)</text>

  <rect class="spof" x="300" y="240" width="180" height="70" rx="6"/>
  <text class="n" x="390" y="262" text-anchor="middle">GLPI-01</text>
  <text class="s" x="390" y="279" text-anchor="middle">SPOF assumé</text>
  <text class="s" x="390" y="295" text-anchor="middle">(outil interne)</text>

  <rect class="ok" x="530" y="240" width="200" height="70" rx="6"/>
  <text class="n" x="630" y="262" text-anchor="middle">Galera ×3</text>
  <text class="s" x="630" y="279" text-anchor="middle">quorum 2/3 (1 panne tolérée)</text>
  <text class="s" x="630" y="295" text-anchor="middle">check SQL non wsrep-aware</text>

  <g font-size="11" fill="#1c2430">
    <rect x="40" y="346" width="14" height="14" class="spof"/><text x="60" y="358">SPOF</text>
    <rect x="120" y="346" width="14" height="14" class="ok"/><text x="140" y="358">Redondé</text>
    <rect x="220" y="346" width="14" height="14" class="mid"/><text x="240" y="358">Redondance partielle</text>
  </g>
</svg>
